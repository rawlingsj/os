package:
    name: python-3.13
    version: 3.13.9
    epoch: 0
    description: the Python programming language
    copyright:
        - license: PSF-2.0
    dependencies:
        runtime:
            - ${{package.name}}-base=${{package.full-version}}
        provides:
            - python3=${{package.full-version}}
            - python-3=${{package.full-version}}
    resources:
        cpu: "8"
        memory: 8Gi
environment:
    contents:
        packages:
            - build-base
            - busybox
            - bzip2-dev
            - ca-certificates-bundle
            - expat-dev
            - gdbm-dev
            - libcap-utils
            - libffi-dev
            - libx11-dev
            - linux-headers
            - mpdecimal-dev
            - ncurses-dev
            - openssl-dev
            - readline-dev
            - sqlite-dev
            - tcl-dev
            - tk-dev
            - xz-dev
            - zlib-dev
pipeline:
    - uses: git-checkout
      with:
        cherry-picks: |
            3.13/333d4a6f4967d3ace91492a39ededbcf3faa76a6: fix CVE-2025-8291
        expected-commit: 8183fa5e3f78ca6ab862de7fb8b14f3d929421e0
        repository: https://github.com/python/cpython.git
        tag: v${{package.version}}
    - name: Force use of system libraries
      runs: |
        rm -rf Modules/expat \
          Modules/_ctypes/darwin* \
          Modules/_ctypes/libffi*
    - uses: patch
      with:
        patches: gh-118224.patch gh-127301.patch
    - name: Configure
      runs: |
        ./configure \
           --host=${{host.triplet.gnu}} \
           --build=${{host.triplet.gnu}} \
           --target=${{host.triplet.gnu}} \
           --prefix=/usr \
           --enable-ipv6 \
           --enable-loadable-sqlite-extensions \
           $([ -d /usr/lib/oldglibc ] || echo --enable-optimizations) \
           --enable-shared \
           --with-lto \
           --with-computed-gotos \
           --with-dbmliborder=gdbm:ndbm \
           --with-system-expat \
           --with-system-libmpdec \
           --without-ensurepip \
           --with-builtin-hashlib-hashes=blake2 \
           --with-wheel-pkg-dir=/usr/share/python-wheels
    - uses: autoconf/make
    - uses: autoconf/make-install
    - runs: |
        find ${{targets.destdir}}/usr/lib -type f -name 'libpython*.a' -exec rm -rf '{}' +
        find ${{targets.destdir}}/usr/lib -type d -name 'test' -exec rm -rf '{}' +
        find ${{targets.destdir}}/usr/lib -type d -name 'tests' -exec rm -rf '{}' +
        find ${{targets.destdir}}/usr/lib -type d -name 'idle_test' -exec rm -rf '{}' +

        cd ${{targets.destdir}}/usr/bin
        rm -f idle3* 2to3*
        rm ${{targets.destdir}}/usr/lib/libpython3.so

        # add dubious python -> python3 link
        ln -s python3 ${{targets.destdir}}/usr/bin/python

        # Drop site-packages README.txt to avoid SCA dep on python3~3.M
        cd ${{targets.destdir}}/usr/lib/${{vars.python}}
        rm site-packages/README.txt
        rmdir site-packages
    - name: remove idle (python IDE)
      runs: |
        rm -R "${{targets.destdir}}/usr/lib/${{vars.python}}/idlelib"
    - runs: |
        rm -R ${{targets.destdir}}/usr/lib/${{vars.python}}/ensurepip/_bundled/
    - runs: |
        find ${{targets.destdir}}/usr/lib -type f -name '*.pyc' -exec rm -rf '{}' +
        find ${{targets.destdir}}/usr/lib -type f -name '*.pyo' -exec rm -rf '{}' +

        export LD_LIBRARY_PATH="${{targets.destdir}}/usr/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
        ${{targets.destdir}}/usr/bin/${{vars.python}} -m compileall --invalidation-mode=unchecked-hash \
            -r100 ${{targets.destdir}}/usr/lib/
    - uses: strip
subpackages:
    - name: ${{package.name}}-base
      pipeline:
        - runs: |
            mkdir -p ${{targets.subpkgdir}}/usr/bin ${{targets.subpkgdir}}/usr/lib
            mv ${{targets.destdir}}/usr/bin/${{vars.python}} \
                ${{targets.destdir}}/usr/bin/pydoc${{vars.pyversion}} \
                ${{targets.subpkgdir}}/usr/bin
            mv -v ${{targets.destdir}}/usr/lib/${{vars.python}} \
               ${{targets.subpkgdir}}/usr/lib
            mv -v ${{targets.destdir}}/usr/lib/libpython${{vars.pyversion}}.so.* \
               ${{targets.subpkgdir}}/usr/lib

            # pyconfig.h is needed at runtime... ugh.
            d=usr/include/${{vars.python}}
            mkdir -p "${{targets.subpkgdir}}"/$d
            mv "${{targets.destdir}}"/$d/pyconfig.h "${{targets.subpkgdir}}"/$d/

            # move usr/lib/python3.X/config-3.X-x86_64-linux-gnu
            # back into main package so the -base-dev can take it below.
            d="usr/lib/${{vars.python}}"
            mkdir -p "${{targets.destdir}}/$d"
            mv -v "${{targets.subpkgdir}}/$d"/config-${{vars.pyversion}}* \
                "${{targets.destdir}}/$d"
      dependencies:
        runtime:
            - py3-pip-wheel
      description: ${{package.name}} without /usr/bin/python3
      test:
        pipeline:
            - uses: test/tw/ldd-check
            - runs: |
                ${{vars.python}} version-check.py ${{package.version}}
            - name: Verify venv installs expected packages
              runs: |
                set +x
                d=$(mktemp -d)
                echo "$ ${{vars.python}} -m venv $d"
                ${{vars.python}} -m venv "$d"
                echo "$ $d/bin/pip list"
                $d/bin/pip list | tee "$d/list.txt"
                wd=/usr/share/python-wheels
                for pkg in pip ; do
                  set -- "$wd"/$pkg-*.whl
                  [ $# -eq 1 ] || {
                    echo "ERROR: found $# wheels in $wd matching $pkg-*.whl";
                    exit 1;
                  }
                  [ -f "$1" ] || {
                    echo "ERROR: $wd/$pkg-*.whl ('$1') was not a file"
                    exit 1
                  }
                  # name is like pip-24.2-py3-none-any.whl. second token is version.
                  wheel=${1}
                  tmp=${wheel##*/}
                  tmp=${tmp#*-}
                  ver=${tmp%%-*}
                  if ! grep -q "${pkg}[ ]\+${ver}$" "$d/list.txt"; then
                      echo "FAIL: did not find '$pkg==$ver' in venv"
                      echo "pip list had:"
                      sed 's,^,>,' "$d/list.txt"
                      exit 1
                  fi
                  echo "PASS: venv installed '$pkg==$ver'"
                done

                rm -Rf "$d"
    - name: ${{package.name}}-privileged-netbindservice
      pipeline:
        - runs: |
            mkdir -p "${{targets.contextdir}}/usr/bin"
            cp "${{targets.outdir}}/${{package.name}}-base/usr/bin/${{vars.python}}" "${{targets.contextdir}}/usr/bin/"
            # Note this sets the capability the test using getcap fails but the
            # capability is set in images with this package.
            setcap cap_net_bind_service=+eip "${{targets.contextdir}}/usr/bin/${{vars.python}}"
      dependencies:
        runtime:
            - ${{package.name}}-base=${{package.full-version}}
        replaces:
            - ${{package.name}}-base
      options:
        no-provides: true
        no-depends: true
      description: Allows Python to bind to ports less than 1024
    - name: ${{package.name}}-tk
      pipeline:
        - runs: |
            # these got moved by python-3.xx-base from ${{targets.destdir}}
            fromd="${{targets.destdir}}-base"
            tod=${{targets.contextdir}}
            d=usr/lib/${{vars.python}}

            mkdir -p "$tod/$d/lib-dynload"
            mv "$fromd/$d/lib-dynload"/_tkinter.*.so "$tod/$d/lib-dynload/"
            mv "$fromd/$d/tkinter" "$tod/$d/"
      dependencies:
        runtime:
            - ${{package.name}}-base=${{package.full-version}}
            - tk
        provides:
            - py3-tkinter=${{package.full-version}}
            - py3.13-tkinter=${{package.full-version}}
      test:
        pipeline:
            - uses: test/tw/ldd-check
            - uses: python/import
              with:
                import: tkinter
                python: python${{vars.pyversion}}
    - name: ${{package.name}}-doc
      pipeline:
        - uses: split/manpages
      description: python3 documentation
      test:
        pipeline:
            - uses: test/docs
    - name: ${{package.name}}-dev
      pipeline:
        - runs: |
            mkdir -p ${{targets.subpkgdir}}/usr/bin
            mv -v ${{targets.destdir}}/usr/bin/python3-config ${{targets.subpkgdir}}/usr/bin

            d="usr/lib/pkgconfig"
            mkdir -p "${{targets.subpkgdir}}/$d"
            mv -v \
               "${{targets.destdir}}"/$d/python3-embed.pc \
               "${{targets.destdir}}"/$d/python3.pc \
               "${{targets.subpkgdir}}/$d/"
      dependencies:
        runtime:
            - ${{package.name}}=${{package.full-version}}
            - ${{package.name}}-base-dev=${{package.full-version}}
        provides:
            - python3-dev=${{package.full-version}}
            - python-3-dev=${{package.full-version}}
      description: python3 development headers
      test:
        pipeline:
            - uses: test/virtualpackage
              with:
                real-pkg-name: ${{subpkg.name}}
                virtual-pkg-name: python3-dev
            - uses: test/virtualpackage
              with:
                real-pkg-name: ${{subpkg.name}}
                virtual-pkg-name: python-3-dev
    - name: ${{package.name}}-base-dev
      pipeline:
        - runs: |
            # usr/lib/python3.X/config-3.X-x86_64-linux-gnu
            # split/dev will only move 2 files from it, but we want all of it.
            d="usr/lib/${{vars.python}}"
            mkdir -p "${{targets.subpkgdir}}/$d"
            mv -v "${{targets.destdir}}"/$d/config-${{vars.pyversion}}* \
               "${{targets.subpkgdir}}"/$d
        - uses: split/dev
      dependencies:
        runtime:
            - ${{package.name}}-base=${{package.full-version}}
      description: python3 development headers
update:
    enabled: true
    manual: false
    require-sequential: false
    shared: true
    github:
        identifier: python/cpython
        strip-prefix: v
        tag-filter: v3.13
        use-tag: true
var-transforms:
    - from: ${{package.name}}
      match: '-'
      replace: ""
      to: python
    - from: ${{package.version}}
      match: (\d).(\d+).(\d+)
      replace: $1.$2
      to: pyversion
test:
    pipeline:
        - name: Verify python and python3 commands exist and work
          runs: |
            python --version 2>&1 | grep -q "Python 3.13" || exit 1
            python3 --version 2>&1 | grep -q "Python 3.13" || exit 1
            echo "PASS: python and python3 commands available"
        - name: Test Python version output format
          runs: |
            version_output=$(python --version 2>&1)
            echo "Version output: $version_output"
            echo "$version_output" | grep -E "Python 3\.13\.[0-9]+" || exit 1
            echo "PASS: Version format correct"
        - name: Test basic Python execution
          runs: |
            result=$(python -c "print('hello world')")
            if [ "$result" != "hello world" ]; then
              echo "FAIL: Expected 'hello world', got '$result'"
              exit 1
            fi
            echo "PASS: Basic Python execution works"
        - name: Test Python arithmetic and expressions
          runs: |
            result=$(python -c "print(2 + 2)")
            if [ "$result" != "4" ]; then
              echo "FAIL: Expected '4', got '$result'"
              exit 1
            fi
            result=$(python -c "print(10 * 5)")
            if [ "$result" != "50" ]; then
              echo "FAIL: Expected '50', got '$result'"
              exit 1
            fi
            echo "PASS: Arithmetic operations work"
        - name: Test core standard library imports
          runs: |
            python -c "import sys; import os; import json; import re; import math" || exit 1
            echo "PASS: Core standard library modules import successfully"
        - name: Test sys module functionality
          runs: |
            version=$(python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}')")
            echo "Python version from sys: $version"
            echo "$version" | grep -E "3\.13\.[0-9]+" || exit 1
            echo "PASS: sys module works correctly"
        - name: Test file I/O operations
          runs: |
            tmpfile=$(mktemp)
            echo "test content" > "$tmpfile"
            python -c "with open('$tmpfile', 'r') as f: content = f.read(); assert content.strip() == 'test content', f'Expected test content, got {content}'"
            rm -f "$tmpfile"
            echo "PASS: File I/O operations work"
        - name: Test JSON module
          runs: |
            result=$(python -c "import json; data = {'key': 'value', 'number': 42}; print(json.dumps(data))")
            echo "$result" | grep -q '"key"' || exit 1
            echo "$result" | grep -q '"value"' || exit 1
            echo "$result" | grep -q '42' || exit 1
            echo "PASS: JSON module works"
        - name: Test list comprehensions and iterators
          runs: |
            result=$(python -c "print(sum([x*x for x in range(5)]))")
            if [ "$result" != "30" ]; then
              echo "FAIL: Expected '30', got '$result'"
              exit 1
            fi
            echo "PASS: List comprehensions work"
        - name: Test exception handling
          runs: |
            python -c "try:\n    x = 1 / 0\nexcept ZeroDivisionError:\n    print('caught')" | grep -q "caught" || exit 1
            echo "PASS: Exception handling works"
        - name: Test pydoc3 command
          runs: |
            pydoc3 --help 2>&1 | grep -q "pydoc" || exit 1
            echo "PASS: pydoc3 command works"
        - name: Test help system
          runs: |
            python --help 2>&1 | grep -q "usage" || exit 1
            python3 --help 2>&1 | grep -q "usage" || exit 1
            echo "PASS: Help system works"
        - name: Test virtual environment creation and functionality
          runs: |
            d=$(mktemp -d)
            python3 -m venv "$d" || exit 1
            test -f "$d/bin/python" || exit 1
            test -f "$d/bin/python3" || exit 1
            test -f "$d/bin/pip" || exit 1
            echo "PASS: Virtual environment created successfully"
            "$d/bin/python" --version 2>&1 | grep -q "Python 3.13" || exit 1
            echo "PASS: Virtual environment Python works"
            "$d/bin/pip" list > /dev/null || exit 1
            echo "PASS: pip in virtual environment works"
            "$d/bin/pip" check || exit 1
            echo "PASS: pip check passes"
            rm -rf "$d"
        - name: Test pip module availability
          runs: |
            python -m pip --version 2>&1 | grep -q "pip" || exit 1
            echo "PASS: pip module available"
        - name: Test hashlib and crypto modules
          runs: |
            result=$(python -c "import hashlib; print(hashlib.sha256(b'test').hexdigest())")
            if [ -z "$result" ]; then
              echo "FAIL: hashlib did not produce output"
              exit 1
            fi
            echo "Hash result: $result"
            echo "PASS: hashlib works"
        - name: Test sqlite3 module
          runs: |
            python -c "import sqlite3; conn = sqlite3.connect(':memory:'); cursor = conn.cursor(); cursor.execute('CREATE TABLE test (id INTEGER)'); cursor.execute('INSERT INTO test VALUES (1)'); cursor.execute('SELECT * FROM test'); assert cursor.fetchone()[0] == 1; conn.close()" || exit 1
            echo "PASS: sqlite3 module works"
        - name: Test multiprocessing module
          runs: |
            python -c "import multiprocessing; print(multiprocessing.cpu_count())" | grep -E "^[0-9]+$" || exit 1
            echo "PASS: multiprocessing module works"
        - name: Test datetime module
          runs: |
            result=$(python -c "from datetime import datetime; print(datetime.now().year)")
            if [ "$result" -lt 2024 ]; then
              echo "FAIL: datetime returned invalid year: $result"
              exit 1
            fi
            echo "PASS: datetime module works"
        - name: Test error handling - invalid syntax
          runs: |
            if python -c "invalid syntax here" 2>&1; then
              echo "FAIL: Python should have rejected invalid syntax"
              exit 1
            fi
            echo "PASS: Python correctly rejects invalid syntax"
        - name: Test error handling - missing module
          runs: |
            if python -c "import nonexistent_module_xyz" 2>&1; then
              echo "FAIL: Python should have failed on missing module"
              exit 1
            fi
            echo "PASS: Python correctly reports missing modules"
